name: Android CI

on:
  push:
    branches:
      - master
      - self-use
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - '.github/**'
      - '!.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') && (github.repository_owner == 'aistra0528' || github.repository_owner == 'Yizhou147') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Gradle
        id: build
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo storeFile=../keystore.jks > signing.properties
            echo storePassword=${{ secrets.KEYSTORE_PASSWORD }} >> signing.properties
            echo keyAlias=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
            echo keyPassword=${{ secrets.KEYSTORE_ALIAS_PASSWORD }} >> signing.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > keystore.jks
          fi
          # 无签名 secrets 时 build.gradle.kts 自动回退 debug 签名，minify 照常开启
          ./gradlew assembleRelease
          echo "filename=$(jq -r '.elements.[0].outputFile' app/build/outputs/apk/release/output-metadata.json)" >> $GITHUB_OUTPUT
          echo "variant=release" >> $GITHUB_OUTPUT
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.build.outputs.filename }}
          path: app/build/outputs/apk/${{ steps.build.outputs.variant }}/${{ steps.build.outputs.filename }}
          archive: false
